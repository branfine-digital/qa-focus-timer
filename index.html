<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Sprint Timer</title>
<script>
  // Set the theme before first paint so there's no flash of the wrong
  // theme while app.js (loaded at the bottom of the page) finishes parsing.
  (function () {
    try {
      if (localStorage.getItem("qa_focus_theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Switch to night mode" title="Switch to night mode">🌙</button>

  <!-- Break-game challenge toasts: fixed position, shown regardless of what
       else is on screen -->
  <div id="challenge-incoming" class="challenge-toast" hidden>
    <p id="challenge-incoming-text"></p>
    <div class="challenge-toast-actions">
      <button id="challenge-accept-btn" class="primary-btn" type="button">Accept</button>
      <button id="challenge-decline-btn" class="secondary-btn" type="button">Decline</button>
    </div>
  </div>

  <!-- Super Challenge (host-started group Pictionary) invite, with a
       30 second countdown to join -->
  <div id="super-incoming" class="challenge-toast super-toast" hidden>
    <p id="super-incoming-text"></p>
    <div class="challenge-toast-actions">
      <button id="super-join-btn" class="primary-btn" type="button">Join</button>
      <button id="super-skip-btn" class="secondary-btn" type="button">Skip</button>
    </div>
  </div>

  <div id="challenge-outgoing" class="challenge-toast" hidden>
    <p id="challenge-outgoing-text"></p>
    <button id="challenge-cancel-btn" class="secondary-btn" type="button">Cancel</button>
  </div>

  <!-- Entry screen: pick name + emoji before joining the room -->
  <div id="entry-screen" class="screen">
    <div class="entry-card">
      <h1>Join the focus room</h1>
      <p class="subtitle">Pick an emoji and a name so your team can see you're here.</p>

      <div id="emoji-grid" class="emoji-grid"></div>

      <input id="name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="off" />

      <button id="join-btn" class="primary-btn" disabled>Join room</button>
      <p id="entry-error" class="entry-error" hidden></p>
    </div>
  </div>

  <!-- Main room screen -->
  <div id="room-screen" class="screen" hidden>

    <header class="room-header">
      <h1>Focus Sprint Timer</h1>
      <div id="presence-bar" class="presence-bar" aria-label="People in the room"></div>
    </header>

    <main class="room-main">

      <!-- Idle / picker state -->
      <section id="picker-panel" class="panel entrance">
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="work">Work</button>
          <button class="mode-tab" data-mode="break">Break</button>
        </div>

        <div id="work-bubbles" class="duration-bubbles">
          <button class="bubble entrance" data-minutes="25">25<span>min</span></button>
          <button class="bubble entrance" data-minutes="45">45<span>min</span></button>
          <button class="bubble entrance" data-minutes="30">30<span>min</span></button>
          <button class="bubble entrance" data-minutes="10">10<span>min</span></button>
        </div>

        <div id="break-bubbles" class="duration-bubbles" hidden>
          <button class="bubble entrance" data-minutes="10">10<span>min</span></button>
          <button class="bubble entrance" data-minutes="15">15<span>min</span></button>
          <button class="bubble entrance" data-minutes="5">5<span>min</span></button>
        </div>

        <div class="custom-row">
          <input id="custom-minutes" type="number" min="1" max="240" placeholder="Custom" />
          <span>minutes</span>
          <button id="custom-start-btn" class="secondary-btn">Start</button>
        </div>
      </section>

      <!-- Running countdown state -->
      <section id="countdown-panel" class="panel entrance" hidden>
        <p id="countdown-mode-label" class="countdown-mode-label">Work session</p>
        <div class="countdown-ring-wrap" id="countdown-ring-wrap">
          <svg class="countdown-ring" viewBox="0 0 200 200">
            <circle class="countdown-ring-track" cx="100" cy="100" r="90"></circle>
            <circle class="countdown-ring-progress" id="countdown-ring-progress" cx="100" cy="100" r="90"></circle>
          </svg>
          <div id="countdown-display" class="countdown-display">25:00</div>
        </div>
        <p id="countdown-started-by" class="countdown-started-by"></p>
        <button id="end-timer-btn" class="end-timer-btn" type="button">End timer</button>
      </section>

      <!-- Break-only: challenge a present teammate to a quick game -->
      <section id="break-games-panel" class="panel entrance" hidden>
        <p class="countdown-mode-label">🎮 Break room games</p>
        <button id="super-challenge-btn" class="primary-btn super-challenge-btn" type="button" hidden>⚡ Super Challenge: Pictionary for everyone</button>
        <div id="game-opponent-list" class="game-opponent-list"></div>
        <p id="game-empty-hint" class="game-empty-hint">No one else is here yet to challenge.</p>
      </section>

    </main>

    <!-- Full-screen "time's up" overlay, dismissed by a click anywhere -->
    <div id="done-overlay" class="done-overlay" hidden>
      <div class="done-content">
        <div class="done-emoji">⏰</div>
        <div class="done-text">Time's up!</div>
        <div class="done-hint">Click anywhere to reset the room</div>
      </div>
    </div>

  </div>

  <!-- Break-game play area. A body-level overlay (like done-overlay) so it
       can show regardless of the picker/countdown state underneath. -->
  <div id="game-overlay" class="game-overlay" hidden>
    <div class="game-overlay-card">
      <div class="game-overlay-header">
        <p id="game-title" class="game-title"></p>
        <p id="game-turn-indicator" class="game-turn-indicator"></p>
      </div>

      <div id="memory-board" class="memory-board" hidden></div>
      <p id="memory-scoreboard" class="memory-scoreboard" hidden></p>

      <div id="wordle-board" class="wordle-board" hidden>
        <div id="wordle-rows" class="wordle-rows"></div>
        <div id="wordle-keyboard" class="wordle-keyboard" aria-label="Letters used so far"></div>
        <form id="wordle-guess-form" class="wordle-guess-form">
          <input id="wordle-guess-input" class="wordle-guess-input" maxlength="5" autocomplete="off" placeholder="Guess" />
          <button type="submit" class="secondary-btn">Guess</button>
        </form>
        <p id="wordle-error" class="entry-error" hidden></p>
      </div>

      <!-- Super Challenge lobby: who's in, join countdown, host's Start button -->
      <div id="pict-lobby" class="pict-lobby" hidden>
        <p id="pict-lobby-status" class="pict-lobby-status"></p>
        <ul id="pict-lobby-players" class="pict-lobby-players"></ul>
        <p id="pict-lobby-extra" class="pict-lobby-extra"></p>
        <button id="pict-lobby-start-btn" class="primary-btn pict-lobby-start-btn" type="button" hidden>Start now</button>
      </div>

      <!-- Pictionary (1v1 and Super Challenge) -->
      <div id="pict-board" class="pict-board" hidden>
        <div class="pict-topbar">
          <span id="pict-round" class="pict-round"></span>
          <span id="pict-timer" class="pict-timer">100</span>
        </div>
        <div class="pict-timer-bar"><div id="pict-timer-fill" class="pict-timer-fill"></div></div>
        <p id="pict-prompt" class="pict-prompt"></p>

        <div class="pict-layout">
          <div class="pict-main">
            <div id="pict-canvas-wrap" class="pict-canvas-wrap">
              <canvas id="pict-canvas" class="pict-canvas"></canvas>
              <div id="pict-reveal" class="pict-reveal" hidden></div>
            </div>

            <div id="pict-tools" class="pict-tools" hidden>
              <div id="pict-colors" class="pict-colors"></div>
              <div class="pict-tool-group">
                <button type="button" class="pict-size-btn" data-size="3" title="Thin"><span style="width:4px;height:4px"></span></button>
                <button type="button" class="pict-size-btn active" data-size="7" title="Medium"><span style="width:8px;height:8px"></span></button>
                <button type="button" class="pict-size-btn" data-size="16" title="Thick"><span style="width:14px;height:14px"></span></button>
                <button type="button" id="pict-eraser-btn" class="pict-tool-btn" title="Eraser">🧽</button>
                <button type="button" id="pict-undo-btn" class="pict-tool-btn" title="Undo">↩️</button>
                <button type="button" id="pict-clear-btn" class="pict-tool-btn" title="Clear">🗑️</button>
              </div>
            </div>

            <form id="pict-guess-form" class="pict-guess-form" hidden>
              <input id="pict-guess-input" class="pict-guess-input" maxlength="40" autocomplete="off" placeholder="Type your guess" />
              <button type="submit" class="secondary-btn">Guess</button>
            </form>
          </div>

          <div class="pict-side">
            <ul id="pict-scores" class="pict-scores"></ul>
            <ul id="pict-feed" class="pict-feed" aria-live="polite"></ul>
          </div>
        </div>
      </div>

      <p id="game-result" class="game-result" hidden></p>
      <p id="game-rematch-hint" class="game-rematch-hint" hidden></p>

      <div class="game-result-actions">
        <button id="game-play-again-btn" class="primary-btn game-play-again-btn" type="button" hidden>Play again</button>
        <button id="game-close-btn" class="secondary-btn game-close-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="pictionary-words.js"></script>
  <script src="app.js"></script>
</body>
</html>
